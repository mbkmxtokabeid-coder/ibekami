# IBEKAMI - Production Nginx Configuration Template
# 
# Petunjuk Penggunaan:
# Salin konfigurasi di bawah ini ke file konfigurasi Nginx situs Anda (misalnya /etc/nginx/sites-available/ibekami)
# dan restart server Nginx (sudo systemctl restart nginx).

server {
    listen 80;
    server_name ibekami.id www.ibekami.id;
    root /var/www/ibekami_bckend/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # ─── 1. GZIP COMPRESSION (Mengompresi CSS/JS untuk menghemat bandwidth & mempercepat TTFB) ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        application/json 
        application/javascript 
        application/x-javascript 
        application/xml 
        application/xml+rss 
        image/svg+xml 
        image/x-icon 
        font/woff 
        font/woff2 
        font/ttf;

    # ─── 2. BROWSER CACHING (Cache Aset Statis selama 1 tahun untuk skor performa 90+) ───
    location ~* \.(js|css|webp|woff2|png|jpg|jpeg|gif|ico|svg|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # ─── 3. ROUTING DEFAULT ───
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # ─── 4. PROSES PHP-FPM ───
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Sesuaikan dengan versi PHP server Anda
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
